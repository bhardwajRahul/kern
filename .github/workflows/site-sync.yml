name: site-sync

# `getkern.dev/install.sh` and `install.ps1` must stay byte-identical to the ones in this repo,
# because a user can audit the file on GitHub before piping the OTHER one into their shell. That is the whole argument for
# `curl | sh` being acceptable here, and it is only true while the two agree.
#
# Nothing enforced it. The file drifted TWICE in a single day: once carrying a stale Darwin message
# that sent Mac users into a dead end the repo had already fixed, and again an hour after being
# re-synced by hand. A rule that depends on someone remembering is not a rule.
#
# Scheduled rather than on push, deliberately: the site is deployed by hand, so for a few minutes
# after a merge the two legitimately differ, and a push-gate would cry wolf every time. A daily check
# turns "someone forgot" into a red mark that cannot be scrolled past.
#
# In the EVENING, on purpose. Cron here is UTC, so 19:00 UTC is 21:00 in Rome under CEST and 20:00
# under CET: after the maintainer's working day either way, and never before 18:00 local, which the
# morning slot could not promise. A red mark is only useful when the person who can fix it is free
# to. The odd minute is not decoration: schedules on the hour queue behind everyone else's.
on:
  schedule:
    - cron: '23 19 * * *'
  workflow_dispatch: {}

jobs:
  installer:
    name: the site serves the installer this repo audits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # TAGS, not just the tip: `site-version-current.py` compares the page against the newest
          # tag, and the default shallow checkout fetches none, so `git describe` would fail on a
          # repository that has plenty.
          fetch-depth: 0
      - name: compare the served installers with this tree
        run: |
          # BOTH INSTALLERS, and the second one is here because checking only the first hid a drift
          # for longer than the one it caught. `install.sh` was audited daily and `install.ps1` was
          # not, so while the Linux file was being re-synced the Windows one sat at 271 lines against
          # the tree's 575: no antivirus detection, no `kern.cmd` fallback, seven fewer checksum
          # checks. A gate that watches one of two identical surfaces does not report the other as
          # unwatched, it reports nothing at all, which reads exactly like "fine".
          #
          # A cache-busting query so Cloudflare answers from origin: a HIT could show yesterday's file
          # and report drift that was already fixed, or hide drift that exists.
          bad=0
          for f in install.sh install.ps1; do
            curl -fsSL "https://getkern.dev/$f?ci=${GITHUB_RUN_ID}" -o "/tmp/served-$f"
            if diff -u "$f" "/tmp/served-$f"; then
              echo "getkern.dev serves the $f in this tree"
            else
              echo "::error::getkern.dev/$f has drifted from $f in main" >&2
              echo "  scp $f root@getkern.dev:/var/www/getkern.dev/$f" >&2
              bad=1
            fi
          done
          # Every file is reported before exiting: stopping at the first turns a two-file drift into a
          # one-file fix and a red run tomorrow.
          exit $bad
      - name: the hero names every platform the page's own metadata claims
        run: |
          curl -fsSL "https://getkern.dev/?ci=${GITHUB_RUN_ID}" -o /tmp/live.html
          python3 scripts/site-hero-platforms.py /tmp/live.html

      - name: the live page does not claim a GPU cap this build does not ship
        # THE SITE IS OUTSIDE THE REPO, so `stale-numbers.py` and its `gpu_claims_agree()` never see
        # it, and a public page advertising a capability the product does not have is the most
        # expensive kind of drift.
        #
        # The two `grep` calls that used to live here BOTH read the real page wrong, the day they
        # were written: the forbidden pattern matched the page's own honest "No GPU limit ships"
        # (the negation read as the claim), and the positive control searched raw HTML for a
        # sentence that is wrapped across lines, so it could only ever fail. Moved into a script so
        # it can be run against a fixture and is covered by `scripts/gates-selftest.py`.
        run: python3 scripts/site-gpu-claims.py /tmp/live.html
      - name: the live page advertises the version that is actually released
        # The page's JSON-LD `softwareVersion` is structured data, so it is what a search engine and
        # an AI answer quote back. MEASURED on 2026-09-07, minutes after v0.9.3 shipped: the page
        # still said 0.9.2, and nothing in this repo could have noticed, because `stale-numbers.py`
        # reads `.md` files and the page is HTML on a VPS.
        #
        # The expected version comes from the newest TAG in the checkout, not from a constant here:
        # nothing about a version is carved into this repository, and a constant would be one more
        # number to forget. `fetch-depth: 0` above is what makes the tags visible.
        run: |
          ver=$(git describe --tags --abbrev=0)
          echo "newest tag in the checkout: $ver"
          python3 scripts/site-version-current.py /tmp/live.html "$ver"
